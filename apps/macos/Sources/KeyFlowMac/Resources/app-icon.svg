<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- macOS Squircle Rounded Background (Premium Deep Slate Black) -->
  <rect width="1024" height="1024" rx="224" fill="#0C0E12" />
  
  <!-- Subtle inner gradient border for macOS design aesthetic -->
  <rect x="8" y="8" width="1008" height="1008" rx="216" fill="none" stroke="white" stroke-opacity="0.04" stroke-width="4" />
  
  <!-- Flow Wave Lines (Dynamic, ultra-clean curves passing behind the key) -->
  <path d="M120 680 C 320 500, 520 860, 720 680 C 820 590, 880 500, 920 420" stroke="#00E5FF" stroke-opacity="0.25" stroke-width="16" stroke-linecap="round" fill="none"/>
  <path d="M80 780 C 280 600, 480 960, 680 780 C 780 690, 840 600, 880 520" stroke="#FFB300" stroke-opacity="0.18" stroke-width="16" stroke-linecap="round" fill="none"/>

  <g transform="translate(512, 512) rotate(-45) translate(-512, -512)">
    <!-- Elegant Minimalist Key (Cyber Cyan & Ice White) -->
    <!-- Key Head (Double Ring / Concentric Circles) -->
    <circle cx="340" cy="512" r="110" stroke="#00E5FF" stroke-width="24" fill="none" stroke-linecap="round"/>
    <circle cx="340" cy="512" r="50" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="16" fill="none"/>
    
    <!-- Key Stem (Clean Line running diagonally) -->
    <line x1="450" y1="512" x2="740" y2="512" stroke="#FFFFFF" stroke-width="24" stroke-linecap="round"/>
    
    <!-- Key Teeth (Flow-styled geometric teeth in Amber Gold) -->
    <path d="M610 512 V 582" stroke="#FFB300" stroke-width="24" stroke-linecap="round"/>
    <path d="M680 512 V 582" stroke="#FFB300" stroke-width="24" stroke-linecap="round"/>
  </g>
</svg>
