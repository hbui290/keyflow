<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- macOS Squircle Background (Deep Obsidian Black) -->
  <rect width="1024" height="1024" rx="230" fill="#0A0A0C" />
  
  <!-- Subtle macOS App Icon Inner Border -->
  <rect x="10" y="10" width="1004" height="1004" rx="220" fill="none" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="6" />

  <!-- Center Artwork (Elegant Symmetrical Geometry) -->
  <g transform="translate(512, 512) scale(0.9) translate(-512, -512)">
    <!-- Ambient Cyan Glow behind the key head -->
    <circle cx="380" cy="512" r="160" fill="#00E5FF" fill-opacity="0.04" filter="blur(40px)"/>
    
    <!-- Ambient Gold Glow behind the key teeth -->
    <circle cx="680" cy="512" r="140" fill="#FFB300" fill-opacity="0.04" filter="blur(40px)"/>

    <!-- The Flow Wave: Beautiful clean, single mathematical wave curve -->
    <path d="M180 570 C 280 430, 480 370, 580 512 C 680 654, 820 630, 840 570" stroke="#00E5FF" stroke-opacity="0.2" stroke-width="16" stroke-linecap="round" fill="none"/>
    <path d="M180 570 C 280 430, 480 370, 580 512 C 680 654, 820 630, 840 570" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="32" stroke-linecap="round" fill="none"/>

    <!-- The Key Structure: Flat, Solid, High-Contrast White and Accent Yellow -->
    <!-- Stem -->
    <path d="M480 512 H 780" stroke="#FFFFFF" stroke-width="48" stroke-linecap="round"/>
    
    <!-- Head of the Key (Symmetric Polygon with round joint) -->
    <rect x="230" y="362" width="300" height="300" rx="90" stroke="#FFFFFF" stroke-width="48" fill="none"/>
    <circle cx="380" cy="512" r="50" fill="#FFFFFF" fill-opacity="0.15" stroke="#FFFFFF" stroke-width="16"/>

    <!-- Teeth (Symmetrical, elegant block elements in pure Amber Gold) -->
    <path d="M640 512 V 600" stroke="#FFB300" stroke-width="48" stroke-linecap="round"/>
    <path d="M720 512 V 600" stroke="#FFB300" stroke-width="48" stroke-linecap="round"/>
  </g>
</svg>
